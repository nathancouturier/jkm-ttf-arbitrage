# The weekly refresh. Each source is fetched on its own and its new data are
# kept only if the study still builds, passes its tests and typesets its note
# on them: a source that fails, or whose data the study cannot take, keeps what
# it had and says so in data/status.json, and the run goes on. Nothing opens an
# issue. EIA shows one week at a time, so the run is repeated on two more days.

name: refresh

on:
  schedule:
    - cron: "30 22 * * 4"   # Thursday evening UTC, after EIA's weekly release
    - cron: "30 22 * * 5"   # Friday evening, for a release moved by a holiday
    - cron: "30 15 * * 1"   # Monday, in case both runs missed it
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install the pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Fetch every source, each on its own, keeping only data the study stands on
        run: make refresh
      - name: Rebuild the site's data, test, and write the note
        run: make
      - name: Commit the new data and start the deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data ':!data/status.json'; then
            echo "No new or revised observation: nothing to commit."
            exit 0
          fi
          git config user.name "Nathan Couturier"
          git config user.email "288413586+nathancouturier@users.noreply.github.com"
          git add -A data site/data tests/fixtures assets README.md JKM-TTF-Arbitrage-Research-Note.pdf
          git commit -m "Refresh the data to $(python -c "import json; print(json.load(open('site/data/study.json'))['data_date'])")"
          git push
          gh workflow run deploy.yml --ref "${{ github.event.repository.default_branch }}"
