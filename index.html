<!-- Every path on this page is relative. The site is served from the subpath
     /jkm-ttf-arbitrage/, never from a domain root, so a leading slash breaks
     the deploy. tools/check-paths.mjs fails on one, and scripts/serve.py
     reproduces the subpath locally. -->

<!-- An empty data URI, so the browser does not ask the origin root for a
     favicon, which on a project page is somebody else's file. -->
<link rel="icon" href="data:,">

<!-- The theme, set before the first paint. It reads the key nc-theme, which
     the portfolio shares because both sites live on the same origin. A blocked
     store falls back to light, the value the html element ships with.
     src/theme.js owns the toggle after load. -->
<script>
  (function () {
    try {
      if (localStorage.getItem("nc-theme") === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", "#17181C");
      }
    } catch (error) {
      /* storage blocked: stay light */
    }
  })();
</script>

<!-- The skip link goes to the view's h1. src/ui.js moves focus there itself so
     the address keeps the route; without script the fragment still scrolls. -->
<a class="skip-link" href="#view-title" data-skip>Skip to the verdict</a>

<header class="site-header">
  <div class="site-header__inner">
    <a class="site-name" href="#/now">JKM and TTF arbitrage study</a>
    <!-- One link per view that exists: src/ui.js builds this list from its
         route table, so a view that is not built is not linked. -->
    <nav class="site-nav" aria-label="Views">
      <ul class="site-nav__list" id="site-nav-list"></ul>
    </nav>
    <div class="site-header__tools">
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Toggle theme" title="Press T to toggle" aria-pressed="false"><span id="theme-icon" aria-hidden="true">&#x263E;&#xFE0E;</span></button>
    </div>
  </div>
</header>

<!-- Short summaries a view announces, kept outside the view so the region is
     already there when its words change. -->
<p id="view-status" class="visually-hidden" role="status" aria-live="polite"></p>

<main id="view" class="view">
  <p class="state-message">Loading the study. Every figure on this page is read from a JSON file in data/.</p>
</main>

<noscript>
  <div class="view">
    <p class="state-message">This page builds itself from the JSON files in data/, so with JavaScript turned off nothing is drawn. The numbers are not hidden: the landing sentence is in data/now.json, readable as text in this repository.</p>
  </div>
</noscript>

<!-- If a module cannot load or run before src/ui.js marks the page started,
     say so instead of loading for ever. A failed module fires an error on the
     window, caught here in the capture phase. -->
<script>
  window.addEventListener("error", function () {
    if (document.documentElement.hasAttribute("data-started")) return;
    var view = document.getElementById("view");
    if (!view) return;
    var said = document.createElement("p");
    said.className = "state-message";
    said.setAttribute("role", "alert");
    said.textContent = "The page's code could not load or run, so nothing can be drawn. Reload the page; if it fails again, the figures are still readable as text in data/now.json.";
    view.replaceChildren(said);
  }, true);
</script>

<script type="module" src="src/ui.js?v=37a5906e90e9"></script>
